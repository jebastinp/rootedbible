<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B5D3B" />
    <meta name="description" content="Rooted - a daily Bible reading tracker for churches. Rooted in God's Word, growing every day." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces is loaded only as an optional Bible-reader serif preference, never as the app's default UI typeface. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <title>Rooted - Bible Reading Tracker</title>
    <script>
      // Applied before first paint so switching themes never flashes the wrong one.
      try {
        if (localStorage.getItem('rooted-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-background text-ink font-sans antialiased">
    <div id="root">
      <div style="max-width: 400px; margin: 20vh auto; padding: 24px; font-family: sans-serif; color: #0B5D3B">
        <h1>Rooted</h1>
        <p id="startup-message" role="status">Loading your reading tracker…</p>
        <p><a href="/login">Open sign in</a></p>
        <noscript>Enable JavaScript in your browser to use Rooted.</noscript>
      </div>
    </div>
    <script src="/startup.js"></script>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
